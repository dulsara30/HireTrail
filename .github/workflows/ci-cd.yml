name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongo-bin-${{ runner.os }}-v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck
      - run: pnpm turbo run test -- --coverage
      - run: pnpm turbo run build
        env:
          API_ORIGIN: http://localhost:4000
      - run: pnpm audit --prod --audit-level=high

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
        env:
          APP_ENV: development
          JWT_ACCESS_SECRET: e2e-only-secret-not-used-anywhere-else-000000
          COOKIE_SECRET: e2e-only-cookie-secret-000000000000000000
          IP_HASH_SALT: e2e-salt-0000000000
          AI_ENABLED: "false"
          API_ORIGIN: http://localhost:4000

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deployments are done by Vercel's own Git integration (previews for pull requests,
  # production for main), so this workflow only runs quality, e2e and secret scanning.
